[package]
description = "Platz.io SDK"
edition = "2024"
license = "Apache-2.0"
name = "platz-sdk"
repository = "https://github.com/platzio/sdk-rs"
version = "0.7.0-beta.4"

[dependencies]
anyhow = "1.0.102"
async-std = "1.13.2"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.32"
kv-derive = "1.0.1"
lazy_static = "1.5.0"
platz-chart-ext = "0.7.1"
reqwest = { version = "0.13.3", features = [
    "json",
    "gzip",
    "brotli",
    "deflate",
    "query",
] }
rust_decimal = "1.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.20.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
